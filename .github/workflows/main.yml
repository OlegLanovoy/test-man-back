name: Backend Deploy

on:
  push:
    branches:
      - master

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      auth: ${{ steps.filter.outputs.auth }}
      user: ${{ steps.filter.outputs.user }}
      post: ${{ steps.filter.outputs.post }}
      compose: ${{ steps.filter.outputs.compose }}
      nginx: ${{ steps.filter.outputs.nginx }}

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - id: filter
        run: |
          echo "auth=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -q '^auth-service/' && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "user=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -q '^user-service/' && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "post=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -q '^post-service/' && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "compose=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -q '^docker-compose.prod.yml$' && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "nginx=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -q '^nginx.conf$' && echo true || echo false)" >> $GITHUB_OUTPUT

  build-and-deploy:
    needs: detect-changes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: 🔐 Decode SSH key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" | base64 --decode > key.pem

          echo "🔐 Устанавливаем права на ключ"
          chmod 600 key.pem
          ls -l key.pem
          file key.pem

      - name: 🐳 Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      - name: 🔧 Build & Push AUTH
        if: needs.detect-changes.outputs.auth == 'true'
        run: |
          docker build -t oleg1111/auth_service ./auth-service
          docker push oleg1111/auth_service

      - name: 🔧 Build & Push USER
        if: needs.detect-changes.outputs.user == 'true'
        run: |
          docker build -t oleg1111/user_service ./user-service
          docker push oleg1111/user_service

      - name: 🔧 Build & Push POST
        if: needs.detect-changes.outputs.post == 'true'
        run: |
          docker build -t oleg1111/posts_service ./post-service
          docker push oleg1111/posts_service

      - name: 📤 Upload docker-compose.yml if changed
        if: needs.detect-changes.outputs.compose == 'true'
        run: |
          scp -o StrictHostKeyChecking=no -i key.pem docker-compose.prod.yml ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:app/docker-compose.yml

      - name: 📤 Upload nginx.conf if changed
        if: needs.detect-changes.outputs.nginx == 'true'
        run: |
          scp -o StrictHostKeyChecking=no -i key.pem nginx.conf ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:app/nginx.conf

      - name: 🚀 Deploy to EC2
        run: |
          echo "📡 Подключаемся к EC2 и деплоим:"
          ssh -o StrictHostKeyChecking=no -i key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            echo "✅ Успешно подключились по SSH"
            
            echo "📥 Тянем свежие образы..."
            docker pull oleg1111/auth_service
            docker pull oleg1111/user_service
            docker pull oleg1111/posts_service
            docker pull oleg1111/gateway

            echo "📂 Переходим в директорию /app"
            cd app

            echo "🔁 Поднимаем сервисы через docker-compose"
            docker compose up -d

            echo "🎉 Деплой завершён!"
          EOF
